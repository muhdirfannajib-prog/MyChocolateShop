<!DOCTYPE html>
<html>
<head>
    <title>My Chocolate Shop - Order</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header>
    <h1>🍫 My Chocolate Shop</h1>
    <p>Place Your Order Here!</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="menu.html">Menu</a>
    <a href="order.html">Order</a>
</nav>

<section>

    <h2>Chocolate Order Form</h2>

    <form id="orderForm">

        <label for="customer">Customer Name:</label>

        <input type="text"
               id="customer"
               placeholder="Enter your name"
               required>

        <br><br>

        <label for="email">Email Address:</label>

        <input type="email"
               id="email"
               placeholder="Enter your email"
               required>

        <br><br>

        <label for="chocolate">Select Chocolate:</label>

        <select id="chocolate" required>

            <option value="10">Milk Chocolate - RM10</option>

            <option value="15">Dark Chocolate - RM15</option>

            <option value="12">White Chocolate - RM12</option>

        </select>

        <br><br>

        <label for="quantity">Quantity:</label>

        <input type="number"
               id="quantity"
               min="1"
               max="100"
               value="1"
               required>

        <br><br>

        <label for="payment">Payment Method:</label>

        <select id="payment" required>

            <option value="Cash">Cash</option>

            <option value="Online Banking">Online Banking</option>

            <option value="E-Wallet">E-Wallet</option>

        </select>

        <br><br>

        <button type="submit">Place Order</button>

        <button type="reset">Clear Form</button>

    </form>

    <div id="result"></div>

</section>

<footer>
    <p>Copyright © 2026 My Chocolate Shop</p>
</footer>

</body>
</html>
